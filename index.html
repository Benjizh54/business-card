<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benjamin Hillion — Acoustic Bureau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1D33;
    --navy-deep:#071422;
    --coral:#FF6B54;
    --green:#3FAE7A;
    --offwhite:#F2F0EA;
    --muted:#7E93A8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--navy);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .topbar{
    height:6px;
    width:100%;
    background:var(--coral);
  }
  .inner{
    padding:40px 32px 32px;
  }
  .mark{
    width:88px;
    height:88px;
    margin:0 auto 28px;
    display:block;
  }
  .name-block{
    text-align:center;
    margin-bottom:6px;
  }
  .name{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:26px;
    color:var(--offwhite);
    letter-spacing:0.5px;
    margin:0;
  }
  .title{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--coral);
    margin:8px 0 2px;
  }
  .quals{
    font-family:Aptos,'Segoe UI','IBM Plex Sans',sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--muted);
    margin:0 0 20px;
  }
  .wordmark{
    display:block;
    width:100%;
    max-width:220px;
    height:auto;
    margin:0 auto 28px;
  }
  .wave{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    height:32px;
    margin:0 0 28px;
  }
  .wave span{
    display:block;
    width:4px;
    border-radius:1px;
    background:linear-gradient(180deg, var(--coral), var(--green));
    animation:eq 1.6s ease-in-out infinite;
  }
  @keyframes eq{
    0%,100%{height:6px;}
    50%{height:var(--h,26px);}
  }
  @media (prefers-reduced-motion:reduce){
    .wave span{animation:none;height:var(--h,18px);}
  }
  .contact{
    border-top:1px solid rgba(242,240,234,0.12);
    padding-top:22px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:Aptos,'Segoe UI','IBM Plex Sans',sans-serif;
    font-size:13px;
    color:var(--offwhite);
    margin-bottom:14px;
  }
  .row:last-child{margin-bottom:0;}
  .row .ico{
    width:16px;
    height:16px;
    flex-shrink:0;
    color:var(--coral);
  }
  .row a{
    color:var(--offwhite);
    text-decoration:none;
  }
  .save-btn{
    margin-top:28px;
    width:100%;
    background:var(--coral);
    color:var(--navy-deep);
    border:none;
    border-radius:2px;
    padding:14px 0;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .save-btn:active{
    transform:scale(0.98);
  }
  .save-btn:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
  }
  .location{
    text-align:center;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:11px;
    color:var(--muted);
    margin-top:18px;
  }
</style>
</head>

  var blob = new Blob([vcard], {type:'text/vcard'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Benjamin-Hillion.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
